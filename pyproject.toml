[project]
name = "python-learning"
version = "0.1.0"
description = "SIWES Python phase topic-by-topic code and the Document Indexer supporting project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only needed to run the Document Indexer against real services.
openai = ["openai>=1.54"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["document_indexer/tests"]
